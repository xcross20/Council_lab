name: Foundation Tests\non:\n  push:\n    branches: [main, 'feat/**']\n  pull_request:\njobs:\n  unittest:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.11'\n      - run: python -m pip install -e .\n      - run: python -m unittest discover -s tests -v\n